name: API Doctor Agent

on:
  workflow_dispatch:
    inputs:
      app:
        description: "Quale app controllare"
        type: choice
        default: "tutte"
        options:
          - tutte
          - cinefighi
          - cinetracker
          - spot
          - prova
  # Permette a Controllo Completo (full-check.yml) di richiamare questo
  # workflow come step di una catena sequenziale — vedi la stessa nota in
  # tests.yml / data-health.yml.
  workflow_call:
    inputs:
      app:
        type: string
        default: "tutte"

jobs:
  api-doctor:
    runs-on: ubuntu-latest
    # Serve solo per lo step "Salva lo stato" in fondo (commit+push su
    # status/api-doctor.json): il GITHUB_TOKEN di default è a sola lettura.
    # Nessun altro step scrive nel repo.
    permissions:
      contents: write
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Installa dipendenze
        run: npm install

      # Test unitari sulla logica pura (classify/rollup PASS-FAIL-INFRA_ERROR
      # in api-doctor/lib/classify.mjs) — istantanei, nessuna rete. Prima
      # dei controlli veri: una regressione qui va fermata subito, non
      # scoperta a valle in un run che sembra passare per il motivo sbagliato.
      - name: Test unitari
        run: npm run test:unit

      # Interroga le API esterne reali (TMDB per CineFighi/CineTracker, meteo
      # /mare/alba-tramonto per Spot): vedi api-doctor/engine.mjs.
      # Deterministico, nessuna chiamata AI qui. Scrive SEMPRE
      # reports/api-doctor-results.json, anche se qualche endpoint fallisce.
      - name: Esegui i controlli
        run: node api-doctor/engine.mjs "${{ inputs.app || 'tutte' }}"

      # Analizza con Claude SOLO gli endpoint in FAIL — zero chiamate se il
      # run è tutto PASS (il caso più comune, vedi api-doctor/analyze.mjs).
      # Non blocca mai il run. Richiede il secret ANTHROPIC_API_KEY (già
      # usato dal QA Agent).
      - name: Analizza le anomalie
        if: always()
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: node api-doctor/analyze.mjs

      - name: Scrivi il riepilogo nel run
        if: always()
        run: node api-doctor/write-summary.mjs

      - name: Carica i risultati JSON
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: api-doctor-results-json
          path: reports/api-doctor-results.json
          retention-days: 30

      # Pubblica l'esito di questo run in status/api-doctor.json, committato nel
      # repo. È la copia leggibile senza token — gli artifact qui sopra
      # richiedono autenticazione e scadono dopo 30 giorni — che consuma la
      # dashboard App Control Center. Non esegue controlli: traduce soltanto
      # il report che questo agente ha già scritto.
      - name: Pubblica lo stato leggibile
        if: always()
        run: node status/build-status.mjs api-doctor

      # Stesso meccanismo già in uso da Data Health/Performance/Scale/
      # Security per il loro storico: nessun database, solo Git. Non blocca
      # mai il run — se non c'è nulla da salvare esce subito, se il push
      # viene rifiutato (run concorrente) riprova con fetch+rebase, e se
      # anche questo fallisce l'esito resta comunque nell'artifact qui sopra.
      - name: Salva lo stato
        if: always()
        continue-on-error: true
        run: |
          if [ -z "$(git status --porcelain status/api-doctor.json)" ]; then
            echo "Nessun nuovo stato da salvare."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add status/api-doctor.json
          git commit -m "chore(api-doctor): aggiorna stato run [skip ci]"
          for i in 1 2 3; do
            if git push; then
              exit 0
            fi
            echo "Push rifiutato (run concorrente?), tentativo $i/3: riprovo dopo un fetch+rebase."
            sleep $((i * 5))
            git fetch origin "${GITHUB_REF_NAME}"
            git rebase "origin/${GITHUB_REF_NAME}" || { echo "Rebase in conflitto: abbandono, l'esito resta comunque nell'artifact JSON."; git rebase --abort; exit 0; }
          done
          echo "Push non riuscito dopo i tentativi: non blocco il run, l'esito resta nell'artifact JSON."
