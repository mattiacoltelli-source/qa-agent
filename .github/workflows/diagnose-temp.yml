name: Diagnosi temporanea LCP CineTracker

on:
  workflow_dispatch:

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Installa dipendenze
        run: npm install

      - name: Installa i browser Playwright (chromium)
        run: npx playwright install --with-deps chromium

      - name: Diagnosi LCP
        run: node perf/diagnose-lcp.mjs

      - name: Carica i risultati
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cinetracker-lcp-diagnosis
          path: |
            reports/cinetracker-lcp-diagnosis.txt
            reports/cinetracker-lhr-full.json
          retention-days: 3
