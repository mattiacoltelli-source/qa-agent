name: TEMP - Diagnosi LCP CineTracker

# TEMPORANEO: indaga perché l'LCP di CineTracker è a 4.3s (vs 1.5s di
# CineFighi, run Performance Agent del 27/08). Da rimuovere insieme a
# perf/diag-lcp.mjs una volta chiusa l'indagine — stesso pattern già usato
# in una diagnosi LCP precedente su questo repo (vedi run #6/#7 del 21/08).

on:
  workflow_dispatch:

jobs:
  diag:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Installa dipendenze
        run: npm install

      - name: Installa i browser Playwright (chromium)
        run: npx playwright install --with-deps chromium

      - name: Diagnosi LCP
        run: node perf/diag-lcp.mjs
