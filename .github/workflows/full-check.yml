name: Controllo Completo

# Lancia i sei agenti in sequenza (mai in parallelo, per evitare che Data
# Health legga dati a metà scrittura se in futuro si abilitassero i test
# @write da qui — vedi FAQ.md) sulla stessa app/e, con un solo bottone. Ogni
# job scrive il proprio riepilogo nella stessa pagina di run — non serve
# unirli a mano, GitHub li impila automaticamente uno sotto l'altro.
#
# I sei workflow restano comunque lanciabili singolarmente come prima
# (tests.yml, data-health.yml, performance.yml, api-doctor.yml, scale.yml,
# security.yml non sono stati toccati nella logica, solo resi richiamabili
# anche da qui via workflow_call). Scale Agent è solo CineFighi (vedi
# scale/README.md) e Security Agent controlla solo le dipendenze npm di
# qa-agent stesso (vedi security/README.md), quindi i loro job non usano
# l'input `app`.
#
# `if: !cancelled()` su health/performance/api-doctor/scale/security: `needs:`
# da solo richiederebbe il successo del job precedente, quindi un singolo
# test smoke fallito bloccherebbe l'intera catena e gli altri agenti non
# partirebbero mai — proprio nel run in cui servirebbe vederli tutti.
# `!cancelled()` mantiene l'ordine sequenziale ma li fa girare comunque,
# fermandosi solo se il run viene annullato a mano.
#
# `schedule` fa partire il controllo una volta a settimana da solo, senza
# bisogno di ricordarsi di lanciarlo: il trigger cron non popola `inputs.app`
# (non esiste un menu a tendina per un run automatico), quindi ogni `with:`
# usa `inputs.app || 'tutte'` per ricadere sempre su "tutte" in quel caso.
#
# Il job `notify` in fondo manda un messaggio Telegram SOLO se almeno uno dei
# sei agenti è fallito (nessun avviso quando va tutto bene, per non
# ridurlo a rumore). Richiede due secret nel repo — TELEGRAM_BOT_TOKEN e
# TELEGRAM_CHAT_ID.
#
# `test_notify`: forza comunque l'invio di un messaggio Telegram di prova,
# anche se tutti gli agenti passano — utile per verificare che i secret
# siano ancora validi (es. dopo aver rigenerato il token del bot) senza
# dover aspettare un fallimento vero.
#
# Prima della notifica, il job scarica i sei report JSON (ogni agente li
# carica come artifact separato: job diversi, filesystem diversi) e li dà in
# pasto a incident/analyze.mjs, che CORRELA i sei segnali insieme — non
# solo quello fallito — per una diagnosi d'insieme (vedi il file per il
# perché: un singolo agente non può vedere, da solo, che QA fallisce per un
# problema dell'API esterna anche se Data Health è pulito). Il risultato,
# se presente, finisce in coda al messaggio Telegram. Zero chiamate a Claude
# se, nonostante tutto, tutti e sei i report sono PASS; nessun errore
# qui blocca l'invio della notifica.

on:
  workflow_dispatch:
    inputs:
      app:
        description: "Quale app controllare (tutti e tre gli agenti)"
        type: choice
        default: "tutte"
        options:
          - tutte
          - cinefighi
          - cinetracker
          - spot
      test_notify:
        description: "Manda comunque un messaggio Telegram di prova (anche se tutto passa)"
        type: boolean
        default: false
  schedule:
    - cron: "0 6 * * 1" # ogni lunedì alle 06:00 UTC, tutte e tre le app

# I permessi di un workflow chiamante sono un tetto massimo per quelli
# richiamati con `uses:` — senza questo, lo step "Salva lo storico" di
# data-health/performance/scale/security (che dichiara contents:write al
# proprio interno) si troverebbe comunque bloccato in sola lettura quando
# lanciato da qui, e lo storico non verrebbe mai salvato in un run di
# Controllo Completo. Non serve su tests.yml/api-doctor.yml, che non
# scrivono nel repo.
permissions:
  contents: write

jobs:
  qa:
    uses: ./.github/workflows/tests.yml
    with:
      app: ${{ inputs.app || 'tutte' }}
    secrets: inherit

  health:
    needs: qa
    if: ${{ !cancelled() }}
    uses: ./.github/workflows/data-health.yml
    with:
      app: ${{ inputs.app || 'tutte' }}
    secrets: inherit

  performance:
    needs: health
    if: ${{ !cancelled() }}
    uses: ./.github/workflows/performance.yml
    with:
      app: ${{ inputs.app || 'tutte' }}
    secrets: inherit

  api-doctor:
    needs: performance
    if: ${{ !cancelled() }}
    uses: ./.github/workflows/api-doctor.yml
    with:
      app: ${{ inputs.app || 'tutte' }}
    secrets: inherit

  scale:
    needs: api-doctor
    if: ${{ !cancelled() }}
    uses: ./.github/workflows/scale.yml
    secrets: inherit

  security:
    needs: scale
    if: ${{ !cancelled() }}
    uses: ./.github/workflows/security.yml
    secrets: inherit

  notify:
    needs: [qa, health, performance, api-doctor, scale, security]
    if: ${{ !cancelled() && (contains(needs.*.result, 'failure') || inputs.test_notify) }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Installa dipendenze
        run: npm install

      # continue-on-error: se un agente non ha prodotto il proprio artifact
      # (es. crash prima dello step di upload), l'incident analyzer tratta
      # semplicemente quel report come assente invece di far fallire il job.
      - name: Scarica il report QA Agent
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: results-json
          path: reports

      - name: Scarica il report Data Health Agent
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: health-results-json
          path: reports

      - name: Scarica il report Performance Agent
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: perf-results-json
          path: reports

      - name: Scarica il report API Doctor Agent
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: api-doctor-results-json
          path: reports

      - name: Scarica il report Scale Agent
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: scale-results-json
          path: reports

      - name: Scarica il report Security Agent
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: security-results-json
          path: reports

      # Con test_notify tutti gli agenti sono realmente PASS: senza questo
      # step l'incident analyzer si fermerebbe subito ("costo zero"), quindi
      # il pulsante di test non verificherebbe mai la chiamata vera a Claude
      # né la diagnosi che finisce su Telegram — solo l'invio del messaggio.
      # Sovrascrive due dei sei report scaricati con un fallimento
      # finto, ma realistico (stesso endpoint in errore su QA e API Doctor,
      # Data Health pulito) — lo stesso scenario di correlazione descritto
      # in incident/README.md. Locale al job, non tocca nulla di reale.
      - name: Simula un fallimento correlato (solo con test_notify)
        if: ${{ inputs.test_notify }}
        run: |
          mkdir -p reports
          cat > reports/results.json << 'EOF'
          {"suites":[{"specs":[{"title":"[TEST] il voto restituisce errore 500","file":"vote.spec.ts","tests":[{"projectName":"cinefighi-mobile","status":"unexpected","results":[{"duration":1200,"errors":[{"message":"Expected 200, got 500 on POST /rest/v1/votes"}]}]}]}],"suites":[]}]}
          EOF
          cat > reports/api-doctor-results.json << 'EOF'
          {"generatedAt":"2026-01-01T00:00:00Z","apps":{"cinefighi":{"label":"CineFighi","result":"FAIL","checks":[{"name":"[TEST] votes upsert","endpoint":"https://example.supabase.co/rest/v1/votes","method":"POST","status":500,"ok":false,"reason":"server error","bodySnippet":"internal error"}]},"cinetracker":{"label":"CineTracker","result":"PASS","checks":[]},"vacanza":{"label":"Spot","result":"PASS","checks":[]}}}
          EOF

      - name: Incident analyzer (correla i sei report con Claude)
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: node incident/analyze.mjs

      - name: Notifica Telegram (solo se manca la configurazione, non fallisce il run)
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          APP_LABEL: ${{ inputs.app || 'tutte' }}
          HAS_FAILURE: ${{ contains(needs.*.result, 'failure') }}
        run: |
          if [ -z "$TELEGRAM_BOT_TOKEN" ] || [ -z "$TELEGRAM_CHAT_ID" ]; then
            echo "TELEGRAM_BOT_TOKEN/TELEGRAM_CHAT_ID non configurati nei secret del repo: notifica saltata."
            exit 0
          fi
          if [ "$HAS_FAILURE" = "true" ]; then
            TITLE="⚠️ <b>Controllo Completo fallito</b>"
          else
            TITLE="🧪 <b>Test notifica Controllo Completo</b> (nessun fallimento reale)"
          fi
          MESSAGE=$'\nApp: '"${APP_LABEL}"$'\nRun: '"${RUN_URL}"
          if [ -f reports/incident-summary.txt ]; then
            MESSAGE="${MESSAGE}"$'\n\n'"$(cat reports/incident-summary.txt)"
          fi
          curl -sS -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            --data-urlencode "chat_id=${TELEGRAM_CHAT_ID}" \
            --data-urlencode "parse_mode=HTML" \
            --data-urlencode "text=${TITLE}${MESSAGE}"
