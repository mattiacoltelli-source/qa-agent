name: Controllo Completo

# Lancia i quattro agenti in sequenza (mai in parallelo, per evitare che Data
# Health legga dati a metà scrittura se in futuro si abilitassero i test
# @write da qui — vedi FAQ.md) sulla stessa app/e, con un solo bottone. Ogni
# job scrive il proprio riepilogo nella stessa pagina di run — non serve
# unirli a mano, GitHub li impila automaticamente uno sotto l'altro.
#
# I quattro workflow restano comunque lanciabili singolarmente come prima
# (tests.yml, data-health.yml, performance.yml, api-doctor.yml non sono
# stati toccati nella logica, solo resi richiamabili anche da qui via
# workflow_call).
#
# `if: !cancelled()` su health/performance/api-doctor: `needs:` da solo
# richiederebbe il successo del job precedente, quindi un singolo test
# smoke fallito bloccherebbe l'intera catena e gli altri tre agenti non
# partirebbero mai — proprio nel run in cui servirebbe vederli tutti.
# `!cancelled()` mantiene l'ordine sequenziale ma li fa girare comunque,
# fermandosi solo se il run viene annullato a mano.
#
# `schedule` fa partire il controllo una volta a settimana da solo, senza
# bisogno di ricordarsi di lanciarlo: il trigger cron non popola `inputs.app`
# (non esiste un menu a tendina per un run automatico), quindi ogni `with:`
# usa `inputs.app || 'tutte'` per ricadere sempre su "tutte" in quel caso.
#
# Il job `notify` in fondo manda un messaggio Telegram SOLO se almeno uno dei
# quattro agenti è fallito (nessun avviso quando va tutto bene, per non
# ridurlo a rumore). Richiede due secret nel repo — TELEGRAM_BOT_TOKEN e
# TELEGRAM_CHAT_ID — non ancora impostati: finché mancano, il job li rileva
# vuoti e non tenta l'invio, senza far fallire il run per questo.

on:
  workflow_dispatch:
    inputs:
      app:
        description: "Quale app controllare (tutti e tre gli agenti)"
        type: choice
        default: "tutte"
        options:
          - tutte
          - cinefighi
          - cinetracker
          - spot
  schedule:
    - cron: "0 6 * * 1" # ogni lunedì alle 06:00 UTC, tutte e tre le app

jobs:
  qa:
    uses: ./.github/workflows/tests.yml
    with:
      app: ${{ inputs.app || 'tutte' }}
    secrets: inherit

  health:
    needs: qa
    if: ${{ !cancelled() }}
    uses: ./.github/workflows/data-health.yml
    with:
      app: ${{ inputs.app || 'tutte' }}
    secrets: inherit

  performance:
    needs: health
    if: ${{ !cancelled() }}
    uses: ./.github/workflows/performance.yml
    with:
      app: ${{ inputs.app || 'tutte' }}
    secrets: inherit

  api-doctor:
    needs: performance
    if: ${{ !cancelled() }}
    uses: ./.github/workflows/api-doctor.yml
    with:
      app: ${{ inputs.app || 'tutte' }}
    secrets: inherit

  notify:
    needs: [qa, health, performance, api-doctor]
    if: ${{ !cancelled() && contains(needs.*.result, 'failure') }}
    runs-on: ubuntu-latest
    steps:
      - name: Notifica Telegram (solo se manca la configurazione, non fallisce il run)
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          APP_LABEL: ${{ inputs.app || 'tutte' }}
        run: |
          if [ -z "$TELEGRAM_BOT_TOKEN" ] || [ -z "$TELEGRAM_CHAT_ID" ]; then
            echo "TELEGRAM_BOT_TOKEN/TELEGRAM_CHAT_ID non configurati nei secret del repo: notifica saltata."
            exit 0
          fi
          MESSAGE=$'⚠️ <b>Controllo Completo fallito</b>\nApp: '"${APP_LABEL}"$'\nRun: '"${RUN_URL}"
          curl -sS -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            --data-urlencode "chat_id=${TELEGRAM_CHAT_ID}" \
            --data-urlencode "parse_mode=HTML" \
            --data-urlencode "text=${MESSAGE}"
