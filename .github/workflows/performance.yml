name: Performance Agent

on:
  workflow_dispatch:
    inputs:
      app:
        description: "Quale app controllare"
        type: choice
        default: "tutte"
        options:
          - tutte
          - cinefighi
          - cinetracker
          - spot
  # Permette a Controllo Completo (full-check.yml) di richiamare questo
  # workflow come step di una catena sequenziale — vedi la stessa nota in
  # tests.yml.
  workflow_call:
    inputs:
      app:
        type: string
        default: "tutte"

jobs:
  performance:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Serve solo per lo step "Salva lo storico" in fondo (commit+push su
    # history/data/performance.jsonl): il GITHUB_TOKEN di default è a sola
    # lettura. Nessun altro step scrive nel repo.
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Installa dipendenze
        run: npm install

      # Stesso Chromium usato dal QA Agent — nessun browser aggiuntivo.
      - name: Installa i browser Playwright (chromium)
        run: npx playwright install --with-deps chromium

      - name: Esegui Lighthouse
        run: node perf/engine.mjs "${{ inputs.app || 'tutte' }}"

      # Analizza con Claude SOLO le app in WARN/FAIL — zero chiamate se il
      # run è tutto PASS (vedi perf/analyze.mjs). Non blocca mai il run.
      - name: Analizza le anomalie
        if: always()
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: node perf/analyze.mjs

      # Confronta i punteggi di oggi (per app) con l'ultimo run registrato
      # e scrive reports/perf-trend.json — PRIMA del riepilogo, che lo
      # legge (vedi perf/history.mjs). Non fa mai fallire il run.
      - name: Aggiorna lo storico
        if: always()
        run: node perf/history.mjs

      - name: Scrivi il riepilogo nel run
        if: always()
        run: node perf/write-summary.mjs

      - name: Carica i risultati JSON
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: perf-results-json
          path: reports/perf-results.json
          retention-days: 30

      # Salva le voci di storico appena scritte da perf/history.mjs
      # (history/data/performance.jsonl) direttamente nel repo — nessun
      # database, solo Git. Non blocca mai il run: se non c'è nulla da
      # salvare esce subito, se il push viene rifiutato (un altro run
      # concorrente ha scritto nel frattempo) riprova con un fetch+rebase,
      # e se anche questo fallisce i dati restano comunque nell'artifact
      # JSON qui sopra — non è una perdita.
      - name: Salva lo storico
        if: always()
        continue-on-error: true
        run: |
          if [ -z "$(git status --porcelain history/data/performance.jsonl)" ]; then
            echo "Nessuna nuova voce di storico da salvare."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add history/data/performance.jsonl
          git commit -m "chore(performance): aggiorna storico run [skip ci]"
          for i in 1 2 3; do
            if git push; then
              exit 0
            fi
            echo "Push rifiutato (run concorrente?), tentativo $i/3: riprovo dopo un fetch+rebase."
            sleep $((i * 5))
            git fetch origin "${GITHUB_REF_NAME}"
            git rebase "origin/${GITHUB_REF_NAME}" || { echo "Rebase in conflitto: abbandono, i dati restano comunque nell'artifact JSON."; git rebase --abort; exit 0; }
          done
          echo "Push non riuscito dopo i tentativi: non blocco il run, i dati restano nell'artifact JSON."
