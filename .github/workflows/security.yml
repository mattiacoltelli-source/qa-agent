name: Security Agent

# Solo le dipendenze npm di qa-agent stesso: le tre app non hanno un
# package.json proprio (vendorizzano gli SDK come file JS già pronti) —
# vedi security/README.md. Nessun selettore "app" quindi, a differenza
# degli altri workflow.

on:
  workflow_dispatch:
  # Permette a Controllo Completo (full-check.yml) di richiamare questo
  # workflow come step della sua catena sequenziale — stessa nota in
  # tests.yml/performance.yml/api-doctor.yml/scale.yml.
  workflow_call:

jobs:
  security:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Serve solo per lo step "Salva lo storico" in fondo (commit+push su
    # history/data/security.jsonl): il GITHUB_TOKEN di default è a sola
    # lettura. Nessun altro step scrive nel repo.
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Installa dipendenze
        run: npm install

      # Test unitari sulla logica pura (rollup di severità in
      # security/lib/rollup.mjs) — istantanei, nessuna rete. Prima del
      # controllo vero: una regressione qui va fermata subito.
      - name: Test unitari
        run: npm run test:unit

      - name: Esegui npm audit
        run: node security/engine.mjs

      # Analizza con Claude SOLO se il run è in WARN/FAIL — zero chiamate su
      # un run PASS (vedi security/analyze.mjs). Non blocca mai il run.
      - name: Analizza le anomalie
        if: always()
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: node security/analyze.mjs

      # Confronta il run di oggi con l'ultimo registrato e scrive
      # reports/security-trend.json — PRIMA del riepilogo, che lo legge
      # (vedi security/history.mjs). Non fa mai fallire il run.
      - name: Aggiorna lo storico
        if: always()
        run: node security/history.mjs

      - name: Scrivi il riepilogo nel run
        if: always()
        run: node security/write-summary.mjs

      - name: Carica i risultati JSON
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: security-results-json
          path: reports/security-results.json
          retention-days: 30

      # Salva la voce di storico appena scritta da security/history.mjs
      # (history/data/security.jsonl) direttamente nel repo — nessun
      # database, solo Git. Non blocca mai il run: se non c'è nulla da
      # salvare esce subito, se il push viene rifiutato (un altro run
      # concorrente ha scritto nel frattempo) riprova con un fetch+rebase,
      # e se anche questo fallisce i dati restano comunque nell'artifact
      # JSON qui sopra — non è una perdita.
      - name: Salva lo storico
        if: always()
        continue-on-error: true
        run: |
          if [ -z "$(git status --porcelain history/data/security.jsonl)" ]; then
            echo "Nessuna nuova voce di storico da salvare."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add history/data/security.jsonl
          git commit -m "chore(security): aggiorna storico run [skip ci]"
          for i in 1 2 3; do
            if git push; then
              exit 0
            fi
            echo "Push rifiutato (run concorrente?), tentativo $i/3: riprovo dopo un fetch+rebase."
            sleep $((i * 5))
            git fetch origin "${GITHUB_REF_NAME}"
            git rebase "origin/${GITHUB_REF_NAME}" || { echo "Rebase in conflitto: abbandono, i dati restano comunque nell'artifact JSON."; git rebase --abort; exit 0; }
          done
          echo "Push non riuscito dopo i tentativi: non blocco il run, i dati restano nell'artifact JSON."
