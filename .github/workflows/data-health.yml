name: Data Health Agent

# Unico agente dei quattro con anche un trigger automatico (schedule),
# eccezione deliberata al "nessun run automatico" degli altri tre — vedi
# FAQ.md "Il workflow non parte da solo, vero?". Motivo: CineFighi e
# CineTracker usano Supabase free tier, che mette in pausa un progetto dopo
# 7 giorni senza richieste API — se non si tocca l'app per una settimana
# (es. vacanza), il progetto si sospende da solo. Questo agente è a sola
# lettura e fa comunque query REST autenticate reali su entrambi i
# progetti (health/projects/cinefighi.mjs, cinetracker.mjs), quindi il giro
# schedulato tiene "svegli" i due Supabase senza bisogno di aprire le app.
#
# Ogni 6 giorni (mai 7, per lasciare un giorno di margine su eventuali
# ritardi del cron di GitHub Actions), alle 03:00 UTC — le 4 del mattino
# ora italiana in inverno (CET), le 5 in ora legale (CEST): un orario in
# cui è improbabile stare lanciando a mano un test @write, per evitare che
# Data Health legga dati a metà scrittura e segnali un falso allarme (vedi
# nota più sotto e health/README.md).
#
# Il job `notify` in fondo manda un messaggio Telegram se questo run
# schedulato trova un FAIL vero (vedi health/engine.mjs — WARN non basta,
# resta solo nel report). Richiede gli stessi due secret di
# full-check.yml — TELEGRAM_BOT_TOKEN e TELEGRAM_CHAT_ID — non ancora
# impostati: finché mancano, il job li rileva vuoti e non tenta l'invio.
on:
  workflow_dispatch:
    inputs:
      app:
        description: "Quale app controllare"
        type: choice
        default: "tutte"
        options:
          - tutte
          - cinefighi
          - cinetracker
          - spot
  # Permette a Controllo Completo (full-check.yml) di richiamare questo
  # workflow come step di una catena sequenziale — vedi la stessa nota in
  # tests.yml.
  workflow_call:
    inputs:
      app:
        type: string
        default: "tutte"
  schedule:
    - cron: "0 3 */6 * *"

jobs:
  health:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Serve solo per lo step "Salva lo storico" in fondo (commit+push su
    # history/data/data-health.jsonl): il GITHUB_TOKEN di default è a sola
    # lettura. Nessun altro step scrive nel repo. Il job `notify` sotto non
    # ne ha bisogno (manda solo un messaggio Telegram).
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Installa dipendenze
        run: npm install

      # Test unitari sulla logica pura (rilevamento residui in
      # health/lib/staleness.mjs) — istantanei, nessuna rete. Prima dei
      # controlli veri: una regressione qui va fermata subito.
      - name: Test unitari
        run: npm run test:unit

      # Uptime + integrità dati (sola lettura su Supabase): vedi
      # health/engine.mjs. Scrive SEMPRE reports/health-results.json,
      # anche se qualcosa fallisce qui sotto.
      - name: Esegui i controlli
        run: node health/engine.mjs "${{ inputs.app || 'tutte' }}"

      # Rete di sicurezza indipendente da quella di tests.yml (che gira
      # sempre a fine run QA, ma solo se il job/runner non muore prima):
      # rimuove eventuali residui di "_QA_Agent_" ancora presenti — lo
      # step sopra li ha appena segnalati (vedi stale_qa_agent_residue in
      # health/projects/cinefighi.mjs) SE più vecchi di qualche ora, quindi
      # va DOPO i controlli, non prima, altrimenti la segnalazione andrebbe
      # persa. Sicuro anche se non c'è nulla da pulire (idempotente) e
      # sicuro a quest'ora: 03:00 UTC è già scelto apposta per non
      # incrociare mai un test @write manuale, vedi il commento in cima al
      # file.
      - name: Ripulisci eventuali residui @write rimasti indietro
        if: always()
        run: node scripts/cleanup-write-residue.mjs

      # Analizza con Claude SOLO le app in WARN/FAIL — zero chiamate se il
      # run è tutto PASS (il caso più comune, vedi health/analyze.mjs). Non
      # blocca mai il run: se la chiave manca o la chiamata fallisce, si
      # registra un avviso e si prosegue senza. Richiede il secret
      # ANTHROPIC_API_KEY (già usato dal QA Agent).
      - name: Analizza le anomalie
        if: always()
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: node health/analyze.mjs

      # Confronta i conteggi di oggi (per app) con l'ultimo run registrato
      # e scrive reports/health-trend.json — PRIMA del riepilogo, che lo
      # legge (vedi health/history.mjs). Non fa mai fallire il run.
      - name: Aggiorna lo storico
        if: always()
        run: node health/history.mjs

      - name: Scrivi il riepilogo nel run
        if: always()
        run: node health/write-summary.mjs

      - name: Carica i risultati JSON
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: health-results-json
          path: reports/health-results.json
          retention-days: 30

      # Salva le voci di storico appena scritte da health/history.mjs
      # (history/data/data-health.jsonl) direttamente nel repo — nessun
      # database, solo Git. Non blocca mai il run: se non c'è nulla da
      # salvare esce subito, se il push viene rifiutato (un altro run
      # concorrente ha scritto nel frattempo — es. lo schedule e un
      # workflow_dispatch manuale) riprova con un fetch+rebase, e se anche
      # questo fallisce i dati restano comunque nell'artifact JSON qui
      # sopra — non è una perdita.
      - name: Salva lo storico
        if: always()
        continue-on-error: true
        run: |
          if [ -z "$(git status --porcelain history/data/data-health.jsonl)" ]; then
            echo "Nessuna nuova voce di storico da salvare."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add history/data/data-health.jsonl
          git commit -m "chore(data-health): aggiorna storico run [skip ci]"
          for i in 1 2 3; do
            if git push; then
              exit 0
            fi
            echo "Push rifiutato (run concorrente?), tentativo $i/3: riprovo dopo un fetch+rebase."
            sleep $((i * 5))
            git fetch origin "${GITHUB_REF_NAME}"
            git rebase "origin/${GITHUB_REF_NAME}" || { echo "Rebase in conflitto: abbandono, i dati restano comunque nell'artifact JSON."; git rebase --abort; exit 0; }
          done
          echo "Push non riuscito dopo i tentativi: non blocco il run, i dati restano nell'artifact JSON."

  notify:
    needs: health
    if: failure()
    runs-on: ubuntu-latest
    steps:
      - name: Notifica Telegram (solo se manca la configurazione, non fallisce il run)
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          APP_LABEL: ${{ inputs.app || 'tutte' }}
        run: |
          if [ -z "$TELEGRAM_BOT_TOKEN" ] || [ -z "$TELEGRAM_CHAT_ID" ]; then
            echo "TELEGRAM_BOT_TOKEN/TELEGRAM_CHAT_ID non configurati nei secret del repo: notifica saltata."
            exit 0
          fi
          MESSAGE=$'⚠️ <b>Data Health Agent fallito</b>\nApp: '"${APP_LABEL}"$'\nRun: '"${RUN_URL}"
          curl -sS -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            --data-urlencode "chat_id=${TELEGRAM_CHAT_ID}" \
            --data-urlencode "parse_mode=HTML" \
            --data-urlencode "text=${MESSAGE}"
