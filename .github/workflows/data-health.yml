name: Data Health Agent

# Unico agente dei quattro con anche un trigger automatico (schedule),
# eccezione deliberata al "nessun run automatico" degli altri tre — vedi
# FAQ.md "Il workflow non parte da solo, vero?". Motivo: CineFighi e
# CineTracker usano Supabase free tier, che mette in pausa un progetto dopo
# 7 giorni senza richieste API — se non si tocca l'app per una settimana
# (es. vacanza), il progetto si sospende da solo. Questo agente è a sola
# lettura e fa comunque query REST autenticate reali su entrambi i
# progetti (health/projects/cinefighi.mjs, cinetracker.mjs), quindi il giro
# schedulato tiene "svegli" i due Supabase senza bisogno di aprire le app.
#
# Ogni 6 giorni (mai 7, per lasciare un giorno di margine su eventuali
# ritardi del cron di GitHub Actions), alle 03:00 UTC — le 4 del mattino
# ora italiana in inverno (CET), le 5 in ora legale (CEST): un orario in
# cui è improbabile stare lanciando a mano un test @write, per evitare che
# Data Health legga dati a metà scrittura e segnali un falso allarme (vedi
# nota più sotto e health/README.md). Nessuna notifica collegata: un run
# automatico scrive comunque il riepilogo in questa pagina di Actions,
# consultabile quando capita di passare di qui.
on:
  workflow_dispatch:
    inputs:
      app:
        description: "Quale app controllare"
        type: choice
        default: "tutte"
        options:
          - tutte
          - cinefighi
          - cinetracker
          - spot
  # Permette a Controllo Completo (full-check.yml) di richiamare questo
  # workflow come step di una catena sequenziale — vedi la stessa nota in
  # tests.yml.
  workflow_call:
    inputs:
      app:
        type: string
        default: "tutte"
  schedule:
    - cron: "0 3 */6 * *"

jobs:
  health:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Installa dipendenze
        run: npm install

      # Uptime + integrità dati (sola lettura su Supabase): vedi
      # health/engine.mjs. Scrive SEMPRE reports/health-results.json,
      # anche se qualcosa fallisce qui sotto.
      - name: Esegui i controlli
        run: node health/engine.mjs "${{ inputs.app || 'tutte' }}"

      # Analizza con Claude SOLO le app in WARN/FAIL — zero chiamate se il
      # run è tutto PASS (il caso più comune, vedi health/analyze.mjs). Non
      # blocca mai il run: se la chiave manca o la chiamata fallisce, si
      # registra un avviso e si prosegue senza. Richiede il secret
      # ANTHROPIC_API_KEY (già usato dal QA Agent).
      - name: Analizza le anomalie
        if: always()
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: node health/analyze.mjs

      - name: Scrivi il riepilogo nel run
        if: always()
        run: node health/write-summary.mjs

      - name: Carica i risultati JSON
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: health-results-json
          path: reports/health-results.json
          retention-days: 30
