name: QA Agent — smoke tests

on:
  workflow_dispatch:
    inputs:
      app:
        description: "Quale app testare"
        type: choice
        default: "tutte"
        options:
          - tutte
          - cinefighi
          - cinetracker
          - spot
      run_write_tests:
        description: "Esegui anche i test @write (scrivono su Supabase/librerie reali)"
        type: boolean
        default: false

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Installa dipendenze
        run: npm install

      - name: Installa i browser Playwright (chromium)
        run: npx playwright install --with-deps chromium

      # "app" seleziona quali progetti Playwright far girare (vedi
      # playwright.config.ts): "tutte" non passa nessun --project e Playwright
      # gira tutti quelli configurati, come faceva prima che questo input
      # esistesse. "spot" internamente è il progetto "vacanza" (nome storico
      # della cartella apps/vacanza, l'app che l'utente conosce come "Spot").
      - name: Esegui la suite
        env:
          RUN_WRITE_TESTS: ${{ github.event.inputs.run_write_tests == 'true' && 'true' || '' }}
        run: |
          case "${{ github.event.inputs.app || 'tutte' }}" in
            cinefighi) PROJECTS="--project=cinefighi-mobile --project=cinefighi-desktop" ;;
            cinetracker) PROJECTS="--project=cinetracker-mobile --project=cinetracker-desktop" ;;
            spot) PROJECTS="--project=vacanza-mobile --project=vacanza-desktop" ;;
            *) PROJECTS="" ;;
          esac
          npx playwright test $PROJECTS

      # Rete di sicurezza indipendente dal browser: gira SEMPRE dopo i test
      # @write (passati, falliti o interrotti a metà) e ripulisce eventuali
      # residui che il try/finally dei singoli test non fosse riuscito a
      # rimuovere (crash, pagina bloccata). Vedi scripts/cleanup-write-residue.mjs.
      - name: Ripulisci eventuali residui dei test @write
        if: ${{ always() && github.event.inputs.run_write_tests == 'true' }}
        run: node scripts/cleanup-write-residue.mjs

      - name: Carica il report HTML
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: reports/html
          retention-days: 14

      - name: Carica i risultati JSON
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: results-json
          path: reports/results.json
          retention-days: 30
