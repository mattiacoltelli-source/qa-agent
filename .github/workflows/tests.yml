name: QA Agent — smoke tests

on:
  workflow_dispatch:
    inputs:
      app:
        description: "Quale app testare"
        type: choice
        default: "tutte"
        options:
          - tutte
          - cinefighi
          - cinetracker
          - spot
          - prova
      run_write_tests:
        description: "Esegui anche i test @write (scrivono su Supabase/librerie reali)"
        type: boolean
        default: false
  # Permette a Controllo Completo (full-check.yml) di richiamare questo
  # workflow come step di una catena sequenziale. Stessi input di
  # workflow_dispatch sopra, ma senza il vincolo "choice" (non supportato
  # nei reusable workflow) — la scelta resta comunque vincolata a monte,
  # nel menu a tendina di chi chiama.
  workflow_call:
    inputs:
      app:
        type: string
        default: "tutte"
      run_write_tests:
        type: boolean
        default: false

jobs:
  smoke:
    runs-on: ubuntu-latest
    # Serve solo per lo step "Salva lo stato" in fondo (commit+push su
    # status/qa.json): il GITHUB_TOKEN di default è a sola lettura.
    # Nessun altro step scrive nel repo.
    permissions:
      contents: write
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Installa dipendenze
        run: npm install

      - name: Installa i browser Playwright (chromium)
        run: npx playwright install --with-deps chromium

      # Crea "_QA_Agent_" nel gruppo CineFighi PRIMA dei test, se non c'è
      # già: così ogni test che lo seleziona (anche quelli di sola lettura,
      # vedi user-picker.spec.ts "profilo ESISTENTE") lo trova davvero già
      # lì, invece di crearlo al volo tramite l'interfaccia. Lo step di
      # pulizia più sotto lo cancella di nuovo a fine run — non un
      # provvedimento una tantum come prima, ma un ciclo crea/usa/cancella ad
      # ogni run, per non lasciarlo visibile per sempre agli amici veri del
      # gruppo. Solo se questo run tocca davvero CineFighi.
      - name: Crea l'utente di test CineFighi (se serve)
        if: ${{ inputs.app == 'cinefighi' || inputs.app == 'tutte' || inputs.app == '' }}
        run: node scripts/ensure-cinefighi-qa-user.mjs

      # "app" seleziona quali progetti Playwright far girare (vedi
      # playwright.config.ts): "tutte" non passa nessun --project e Playwright
      # gira tutti quelli configurati, come faceva prima che questo input
      # esistesse. "spot" internamente è il progetto "vacanza" (nome storico
      # della cartella apps/vacanza, l'app che l'utente conosce come "Spot").
      - name: Esegui la suite
        env:
          RUN_WRITE_TESTS: ${{ inputs.run_write_tests == true && 'true' || '' }}
        run: |
          case "${{ inputs.app || 'tutte' }}" in
            cinefighi) PROJECTS="--project=cinefighi-mobile --project=cinefighi-desktop" ;;
            cinetracker) PROJECTS="--project=cinetracker-mobile --project=cinetracker-desktop" ;;
            spot) PROJECTS="--project=vacanza-mobile --project=vacanza-desktop" ;;
            prova) PROJECTS="--project=prova-mobile --project=prova-desktop" ;;
            *) PROJECTS="" ;;
          esac
          npx playwright test $PROJECTS

      # Rete di sicurezza indipendente dal browser: gira SEMPRE (letture o
      # scritture, passato o fallito) e ripulisce eventuali residui che il
      # try/finally dei singoli test non fosse riuscito a rimuovere (crash,
      # pagina bloccata) — incluso l'utente di test CineFighi creato sopra,
      # così non resta visibile per sempre nella lista del gruppo. Vedi
      # scripts/cleanup-write-residue.mjs.
      - name: Ripulisci eventuali residui dei test
        if: always()
        run: node scripts/cleanup-write-residue.mjs

      # Analizza SOLO i test falliti con Claude (causa probabile, severità,
      # correlazione tra fallimenti con lo stesso pattern) — zero chiamate
      # se il run non ha fallimenti (il caso più comune, vedi
      # scripts/analyze-failures.mjs). Non blocca mai il run: se la chiave
      # manca o la chiamata fallisce, si registra un avviso e si prosegue
      # senza — l'analisi AI è un arricchimento del riepilogo, non un
      # requisito. Richiede il secret ANTHROPIC_API_KEY (Settings → Secrets
      # and variables → Actions).
      - name: Analizza i fallimenti
        if: always()
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: node scripts/analyze-failures.mjs

      # Scrive un riepilogo leggibile (PASS/FAIL per app, dettaglio dei
      # fallimenti, più l'analisi Claude quando disponibile) direttamente su
      # questa pagina — niente da scaricare, leggibile anche da telefono.
      # Vedi scripts/write-summary.mjs.
      - name: Scrivi il riepilogo nel run
        if: always()
        run: node scripts/write-summary.mjs

      - name: Carica il report HTML
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: reports/html
          retention-days: 14

      - name: Carica i risultati JSON
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: results-json
          path: reports/results.json
          retention-days: 30

      # Pubblica l'esito di questo run in status/qa.json, committato nel
      # repo. È la copia leggibile senza token — gli artifact qui sopra
      # richiedono autenticazione e scadono dopo 30 giorni — che consuma la
      # dashboard App Control Center. Non esegue controlli: traduce soltanto
      # il report che questo agente ha già scritto.
      - name: Pubblica lo stato leggibile
        if: always()
        run: node status/build-status.mjs qa

      # Stesso meccanismo già in uso da Data Health/Performance/Scale/
      # Security per il loro storico: nessun database, solo Git. Non blocca
      # mai il run — se non c'è nulla da salvare esce subito, se il push
      # viene rifiutato (run concorrente) riprova con fetch+rebase, e se
      # anche questo fallisce l'esito resta comunque nell'artifact qui sopra.
      - name: Salva lo stato
        if: always()
        continue-on-error: true
        run: |
          if [ -z "$(git status --porcelain status/qa.json)" ]; then
            echo "Nessun nuovo stato da salvare."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add status/qa.json
          git commit -m "chore(qa): aggiorna stato run [skip ci]"
          for i in 1 2 3; do
            if git push; then
              exit 0
            fi
            echo "Push rifiutato (run concorrente?), tentativo $i/3: riprovo dopo un fetch+rebase."
            sleep $((i * 5))
            git fetch origin "${GITHUB_REF_NAME}"
            git rebase "origin/${GITHUB_REF_NAME}" || { echo "Rebase in conflitto: abbandono, l'esito resta comunque nell'artifact JSON."; git rebase --abort; exit 0; }
          done
          echo "Push non riuscito dopo i tentativi: non blocco il run, l'esito resta nell'artifact JSON."
